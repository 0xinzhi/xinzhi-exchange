# ============================================================
# 等价交换（独立版）配置
# ⚠ 所有默认值都同时写在代码里：老服 config.yml 没有新键也能正常跑。
# ============================================================

price:
  # 定价道具（价格定制 / 批量定价 / xzex set）填的数精确到两位小数（最小 0.01），没有配置项；
  # 引擎内部与其余显示仍是全精度 —— 腐竹 2026-10-18 订正过的口径。
  # 手续费：卖出时扣、买入时加（0 = 平价）。浮点，0.05 = 5%
  tax: 0.0
  # 单笔兑换上限（个）；0 = 不限（建议留个上限，防手滑）
  max-per-transaction: 1000000
  # 兑换价格上限：EMC 单价高于它的物品整件禁止交易（买卖都不行，也不进清单）。
  # 腐竹 2026-10-19：「比如设置上限为10w，那么所有emc值高于10w的物品都不允许交易。」
  # 填数字（100000 = 10 万）；0 = 不限。
  trade-max: 0
  # 压缩物品卖价封顶（腐竹 2026-10-18 第八轮：「卖价超过100就固定为100」；只降卖价不降买价）。
  # 「压缩物品」= id 或显示名命中 compressed-keywords 的物品（9 合 1 链，魔法糖/圆石最夸张）。
  # 由这些物品做出来的东西，卖价会跟着重算变低；买价不变。
  compressed-sell-cap: 100
  # id 命中直接算；只有显示名命中的，还必须是「N 合 1」压缩配方的产物（不会误伤"压缩机"这类机器）
  compressed-keywords:
    - COMPRESSED
    - MAGIC_SUGAR
    - 压缩
    - 魔法糖
  # 生成器产物：由「机器配方链不含该材料」的生成器产出时，卖价 = 机器价 × 这个比例，
  # 不看该材料在机器里的产出数量（腐竹 2026-10-18 第八轮：0.1%）。0 = 关。
  generator-sell-rate: 0.001
  generator-keywords:
    - GENERATOR
  # 地理资源（Slimefun GEOResource）默认价：它们由矿机产出、没有合成配方，
  # 按原定价链路永远算不出价。腐竹 2026-10-18：「除非有手动定价否则地理资源都按30算」。
  # 0 = 关（恢复"没配方就没价"）。prices.yml / 手工价里写了的以那边为准。
  geo-resource-default: 30
  # ---- 生物掉落物兜底价（腐竹 2026-10-26）----
  # 附属注册的生物特殊掉落物既没配方、也没锚点，按配方链永远算不出价；
  # 这里按「掉落概率」给它们补一条价，只补配方算不出的缺口（已有的价一律不动）。
  # 档位（腐竹 m01261）：>=50% → 5 EMC / >=20% → 20 / >=10% → 100 / >=5% → 200 / <5% → 500
  mob-drop:
    # 开关：false = 不按掉落表补价
    enabled: true
    # 读不到掉落概率时的兜底价（腐竹：「兜底按 60 计算吧」「兜底 60」）。0 = 不给价
    unknown-emc: 60
  # ---- 破坏方块概率掉落兜底价（腐竹 2026-10-28）----
  # 来源：RSC 子附属 items.yml 里的 drop_from / drop_chance / drop_amount（明文，可读）。
  # 不能拿「方块价 ÷ 概率」算：方块挖掉会掉回自身，玩家摆了再挖可以无限刷，成本≈0
  # （腐竹：「其实，信标可以反复放置刷取这个玉的，唯一值得关注的是无法采集的方块」）。
  # 口径（腐竹原话：「可重复的按概率划分，30%以上5emc，30以下15emc，5以下30emc。
  #   无法再生的资源按100emc。还有就是那个下界传送门算是可再生。」）
  # 只补「配方链算不出价」的物品；已经有价的物品不受影响。
  block-drop:
    enabled: true
    # 能反复刷取的方块（挖了掉回自身，Material.isItem() = 能拿在手上摆回去）：
    high-chance: 30    # 概率 >= 这个 → high-emc
    high-emc: 5
    mid-chance: 5      # 概率 >= 这个 → mid-emc
    mid-emc: 15
    low-emc: 30        # 更低概率
    # 无法再生的方块（挖掉不会掉回自身、玩家也造不出来，如紫水晶母岩）
    non-renewable-emc: 100
    # 额外算作可再生的方块：没有物品形态，但玩家能自己造出来
    renewable-blocks:
      - NETHER_PORTAL
  # 是否把"算不出价"的物品也列进界面（默认不列）
  allow-unpriced: false
  # 卖入时拒收「被改过」的物品（名称 / Lore / 附魔 / 耐久 / 自定义数据与模板不一致）。
  # 腐竹 2026-10-18：「不允许卖改过lore或名称等的物品」。关掉 = 只认 id，改过的也按原价收。
  reject-modified-items: true
  # 两阶段定价：先只用「粘液本体 / 原版」机器的配方定价，
  # 再用全部配方（含其它附属）给剩下的物品定价；已定的价永不下调。
  # 关掉 = 所有配方一起算（速度快一点，但附属机器能改本体物品的价）。
  staged: true
  # 机器依赖：一条配方要等「它的机器本身先算出价」才能用来定价。
  # 原因（腐竹 2026-10-18）：机器不是配方的输入，所以「用自己造的高级机器
  # 把自己造得更便宜」这种隐性环原来根本没被拦住，一些高级机器会把普通材料压到地板价。
  # 打开后：机器先有价 ⇒ 机器的材料链里不可能含它的产出 ⇒ 这类配方自动跳过。
  # 虚拟机器（RT_*，如多方块/原版工作台）与查不到实物的配方类型算「随手可得」，不受影响。
  # 代价：机器算不出价的配方一律不报价（宁可没价，也不给错价）。
  require-machine: true
  # 原版·有配方的物品：true = 由配方推导（石英块自动变成 16）；粘液物品的锚点不动
  # 手动写的价（manual 段、批量定价面板）永远保留，不受此项影响
  # 服主 2026-10-29 决定改用它；想恢复旧行为 /xzex anchor off
  anchor-derive: true
  # 机器引导（0.4.8）：附属机器的造价配方都挂在「别的也没价的机器」上，
  # 不引导的话「机器没价 ⇒ 配方不报价」会把整片附属配方锁死（实测 14145 条里跳 13934 条）。
  # true = 先忽略机器门槛跑一趟，只把「当机器用的那些物品」的价当种子，再按门槛正常定价。
  machine-bootstrap: true
  # 原版物品优先用原版配方（工作台/熔炉/切石机…），算不出才用粘液机器的配方
  # 腐竹 2026-10-29：「原版物品配方优先使用原版配方。尽量不使用粘液配方」
  vanilla-first: true
  # 同色变体统一价（床 / 羊毛 / 旗帜 / 潜影盒 / 陶瓦 / 染料 …）：max=全族最高价、min、avg、off
  palette-unify: max

scan:
  # 启动后是否自动全量扫描配方库
  on-start: true
  # 启动时是否先读上次的配方文件当临时价表（腐竹 2026-10-18：「每次服务器重启都需要
  # 重新扫描所有配方」）。默认 false = 每次重启都全量重扫，不沿用旧结果；
  # 扫描完成前只有基础定价表里的物品有价。设 true 只为了「启动瞬间就有价」，
  # 那几秒用的是旧配方。扫描成功后磁盘会与本次结果完全一致（过期文件自动删掉）。
  reuse-disk: false
  # 延迟多少 tick 开始扫（等其它附属把物品注册完；20 tick = 1 秒）
  # ⚠ 别调得太早：实测（2026-10-18）启动后 5 秒扫，会把 FinalTECH 那类还在慢慢填配方表的
  #   附属扫成半成品 —— 同一份服 +5 秒扫出 3,698 个有价，+38 秒重扫变 3,899（差 201 个）。
  #   默认 400 tick = 20 秒，扫出来才和稳定态一致。
  delay-ticks: 400
  # 启动补扫：首次扫描完成后再等这么多 tick 全量重扫一遍，**只有配方内容真的变了**才重建价表。
  # 为什么：有些附属（实测 FinalTECH）启动后还在慢慢填配方表，20 秒扫出来的是半成品——
  #   同一台服 +20 秒有价 3,698、+38 秒重扫 3,899。比的是内容摘要，不是条数。
  # 0 = 关（只扫一次）。默认 1200 tick = 60 秒。
  settle-ticks: 1200
  # 多方块机器的配方（腿 1）
  extract-multiblock: true
  # 物品自身配方（腿 2，兜底：只给没有任何真实配方的物品补一条）
  extract-own-recipes: true
  # 丢弃自环配方（1 × X → N × X 这类复制机）
  drop-self-loop: true
  # 配方机器黑名单：这些机器扫出来的配方一律不入库（写粘液 id，不带 SF:，大小写不敏感）
  # 腐竹 2026-10-18 点名：LOGITECH_CARD_MAKER（卡牌制造机）把材料链的价格带偏了。
  # 改完要 /xzex scan 重扫（或重启），已有的配方文件会按新名单裁掉。
  machine-blacklist:
    - LOGITECH_CARD_MAKER
  # 配方材料黑名单（腐竹 2026-10-28）：「只要配方的材料里出现这个 id，整条配方不入库也不展示」。
  # 用途：身份靠 nbt 决定的物品 —— 替代卡把被替代物品写在 nbt(rep_mat_id) 里，
  #   而等价交换只按粘液 id 归一、忽略 nbt，于是任意一张裸卡都能冒充配方要的任何材料
  #   （用低价物品做成卡、再去掉 nbt，就能拿它顶掉高价材料）。
  # 副作用：以这些卡为材料的配方（实测 15619 条 / 20.7%）整体消失，其产物可能因此失去价格。
  # 写粘液 id，不带 SF:，大小写不敏感。改完 /xzex scan 重扫（或重启）生效。
  material-blacklist:
    - LOGITECH_REPLACE_CARD
    - LOGITECH_REPLACE_SF_CARD
  # 附属读取顺序（腐竹 2026-10-26）：列表里的附属按这个顺序先读，
  # 没列到的垫在最后（保持原注册顺序）。RSC 一定要放最后 ——
  # 腐竹原话：「rsc的附属太杂乱了」，它里面有很多把配方改简单的复制品，
  # 读早了会让昂贵物品变白菜价。
  # 匹配方式：忽略大小写，比对附属自报名（SlimefunItem.getAddon().getName()）
  #   与插件名，包含即命中（写 FinalTECH 就能命中 FinalTECH-Changed）。
  # 未命中会在日志「本次读取顺序」里以「未列出」标出来，照着补即可。
  addon-order:
    - LogiTech
    - InfinityExpansion
    - FinalTECH
    - MagicExpansion
    - MomoTech
  # 永远最后读的附属（排在 addon-order 与「未列出」之后）。腐竹：rsc 一定要最后。
  addon-order-last:
    - RykenSlimefunCustomizer

# ---- 功能道具（腐竹 2026-10-26）----
ability:
  flight:
    # 飞行护符：开启后每秒扣这么多 EMC（余额不足自动关闭）
    emc-per-second: 500
  aura:
    # 范围伤害护符：初始半径（格）时每秒扣的 EMC
    emc-per-second: 1000
    # 初始半径（格）
    base-radius: 3
    # 半径每 +1 格，每秒消耗量乘这个倍数（默认 3；腐竹 2026-10-26 从 10 下调）
    radius-multiplier: 3
    # 每次攻击（挥击，空挥也算）对范围内生物造成的伤害
    damage: 2.0
    # 两次挥击之间最短间隔（毫秒）：一次点击会同时触发「用物品」和「挥手」，这个间隔防止双倍伤害
    cooldown-ms: 250
    # 是否连玩家一起打（默认 false：只打非玩家生物）
    hit-players: false
    # 不打的实体类型（反作弊假人这类无实体生物靠 Citizens 的 NPC metadata 自动排除，
    # 这里再兜一层：盔甲架等）
    ignored-entities:
      - ARMOR_STAND

# ---- 等价终端分阶 ----
terminal:
  # 「刷新价表」按钮的全服冷却（秒，腐竹 2026-10-28：2 小时；0 = 不限制）
  # 该按钮本身是管理员功能（权限 xzex.admin / op）
  refresh-cooldown-seconds: 7200
  # 每把显示上限提升 1 点，花费多少 EMC
  upgrade:
    emc-per-cap: 1000
  # 初级终端（钻石/铁/金/绿宝石合成）：初始显示 100 EMC 以下
  basic:
    cap: 100
    # 初级终端在道具内升级的封顶（到这就锁死，想更高要拿中级）
    cap-ceiling: 2000
  # 中级终端（下界之星）：初始显示 2000 EMC 以下，之后在道具内无限升级
  mid:
    cap: 2000

# ---- 机器 ----
machine:
  sell:
    # 卖出机结算周期（tick）；20 tick = 1 秒
    interval-ticks: 2
  buy:
    # 买入机周期（tick）：一个周期把 24 个模板全部买一遍（不再轮转）
    # 2026-10-26 腐竹：从 20 改成 2（20 tick 太慢，放上等价道具后像「迟迟不运行」）
    interval-ticks: 2
    # 余额低于它时买入机待机（机器面板上还能自己改，机器自己的值优先）
    min-balance: 0
  gen:
    # EMC 发电机：1 EMC 换多少 J
    joules-per-emc: 500
    capacity: 2000000000

# ---- 等价合成台 / 等价运输机（腐竹 2026-10-26 m00564、m00819 拆成两台）----
synthesis:
  craft:
    # 等价合成台（XZEX_SYNTHESIZER）：时间成本 = 配方耗时（tick）× 这个数；读不到耗时按 1 tick 算。
    # 材料成本另算：材料先用玩家背包里的，缺的按买价扣 EMC。
    emc-per-tick: 100
  logistics:
    # 等价运输机（XZEX_TRANSPORTER）：每成功投入一个槽位收多少 EMC（物品本身的购买价另算）
    emc-per-slot: 100
    # 运输机自动处理周期（tick）；腐竹 2026-10-26：机器的周期为 2 tick
    interval-ticks: 2

gui:
  # 打开界面时的默认排序：price-desc / price-asc / name
  default-sort: price-desc
  # 数量弹窗里滑条的快速选择上限（腐竹 2026-10-18 第七轮：128）。
  # 输入框仍然可以填任意精确值，滑条只负责"大概选"。
  quick-amount-max: 128
  # 已废弃：版面固定为「无 mod 45 物品 + 9 导航 = 54 格 / 装 mod 54 物品 + 9 导航 = 63 格」，
  # 跳页与数量都走弹窗（滑条 + 输入框）。这个键不再参与计算，保留只为老配置不报错。
  page-size: 45

# ---- 自动更新 ----
# 启动时向 GitHub Releases 查一次新版本（腐竹 2026-10-28）
update:
  # 关掉就不联网
  check: true
  # 仓库 owner/name
  repo: 0xinzhi/xinzhi-exchange
  # 开服期间也要时不时查一次（分钟；0 = 只在启动时查）。
  # 查到就下到 plugins/update/，下次正常关服直接替换，不用等下一轮启服才拿到。
  interval-minutes: 30
  # true = 查到新版顺手下载到 plugins/update/，重启服务器后生效（默认开）
  # 下载只落到 plugins/update/，绝不热替换正在运行的 jar（版本不配套会让服起不来）
  download: true
  # true = 关服时再派脚本把 plugins/update 里那份覆盖到插件本体（jar 已解锁才动），
  # 下次启动即新版。脚本失败会保留旧 jar，服照常能起。Windows 用 cmd，Linux 用 sh。
  auto-install: true
  # 有新版本时怎么让人知道（腐竹 m00733：怎么让其他玩家提醒服主去更新）
  notify:
    # 在线管理员（op 或 xzex.update）立刻收到聊天提示
    admins: true
    # 全服玩家也收到（可能刷屏，默认关）
    players: false
    # 管理员不在线的话，下次进服时提示一次
    on-join: true
